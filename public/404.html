<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RelayBus</title>
    <script>
      (function () {
        var base = '/RB_demo/';
        var l = window.location;
        if (l.pathname.indexOf(base) === 0) {
          var route = l.pathname.slice(base.length - 1) + l.search + l.hash;
          l.replace(base + '?p=' + encodeURIComponent(route));
        } else {
          l.replace(base);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
